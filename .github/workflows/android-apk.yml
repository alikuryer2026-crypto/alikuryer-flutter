name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, professional-v1]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --platforms=android --project-name=alikuryer --org=uz.alikuryer .
      - name: Enable Android internet access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' + chr(10) + '    <uses-permission android:name="android.permission.INTERNET"/>')
          p.write_text(s)
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos
      - name: Build installable demo APK
        run: flutter build apk --debug
      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: Alikuryer-professional-v1-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
