name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --platforms=android --project-name=alikuryer --org=uz.alikuryer .
      - name: Dependencies
        run: flutter pub get
      - name: Build installable demo APK
        run: flutter build apk --debug
      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: Alikuryer-demo-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
